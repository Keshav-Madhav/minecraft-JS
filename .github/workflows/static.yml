# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # MANUAL-ONLY. This GitHub Pages deploy no longer runs on every push — that
  # consumed Actions minutes (the cost you wanted to avoid). Deployment is now
  # handled by Vercel/Netlify, which build on push via their own free git
  # integration. Run this from the Actions tab only if you still want a Pages
  # build; otherwise it's safe to delete this file entirely.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
      - name: Install Dependecies
        run: npm install
      - name: Build App
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
